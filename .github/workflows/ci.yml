name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - run: npm ci

      # Blocking — correctness and security only (docs/CodingStandards.md §0).
      - name: Typecheck
        run: npm run typecheck

      # Blocking on warnings too, not just errors (--max-warnings=0). Task #60
      # drove the repo to 0 warnings with zero suppressions; this keeps it
      # there, so a warning can't quietly accumulate again.
      - name: Lint (zero warnings)
        run: npm run lint:strict

      # Task #61 — Vitest suite (src/components/ design-system library,
      # engines/formulaEngine, constants/). Blocking: same tier as
      # typecheck/lint above, not advisory.
      - name: Unit tests
        run: npm run test:run

      - name: Secret scan
        run: npm run scan:secrets

      - name: Clippy (correctness + suspicious)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D clippy::correctness -D clippy::suspicious

      # Auto-applied by pre-commit; checked again here so a bypassed hook
      # still surfaces — but this is advisory, same as the doc says.
      - name: Format check (advisory)
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true

      # The real gate: compiles the frontend and the full Tauri binary,
      # unbundled — proves the whole app builds, not just that it type-checks.
      - name: Build (debug)
        run: |
          npm run build
          npx tauri build --debug --no-bundle

      # Advisory — comments on the PR, never fails it (§1.3, §20.3).
      - name: Size report (advisory)
        run: npm run size:report
        continue-on-error: true
