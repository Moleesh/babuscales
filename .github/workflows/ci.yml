name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - run: npm ci

      # Blocking — correctness and security only (docs/CodingStandards.md §0).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint (errors only)
        run: npm run lint:errors

      # Non-blocking for now (2026-08-11, user request) — task #61's test
      # suite and the zero-warnings lint gate are still young; both steps
      # still run and report on every PR/push, they just don't fail the
      # build yet. Revisit turning these blocking once the suite has had
      # more time to prove itself out. `lint:errors` above stays the real
      # blocking lint gate in the meantime.
      - name: Lint (zero warnings, advisory)
        run: npm run lint:strict
        continue-on-error: true

      # Task #61 — Vitest suite (src/components/ design-system library,
      # engines/formulaEngine, constants/).
      - name: Unit tests (advisory)
        run: npm run test:run
        continue-on-error: true

      - name: Secret scan
        run: npm run scan:secrets

      - name: Clippy (correctness + suspicious)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D clippy::correctness -D clippy::suspicious

      # Auto-applied by pre-commit; checked again here so a bypassed hook
      # still surfaces — but this is advisory, same as the doc says.
      - name: Format check (advisory)
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true

      # The real gate: compiles the frontend and the full Tauri binary,
      # unbundled — proves the whole app builds, not just that it type-checks.
      - name: Build (debug)
        run: |
          npm run build
          npx tauri build --debug --no-bundle

      # Advisory — comments on the PR, never fails it (§1.3, §20.3).
      - name: Size report (advisory)
        run: npm run size:report
        continue-on-error: true
