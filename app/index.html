<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BabuScales</title>
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/base.css" />
    </head>
    <body>
        <div id="root"></div>
        <!--
          Shown until App.tsx's first render removes it (see App's own
          `useEffect(() => document.getElementById("app-splash")?.remove())`).
          Lives outside React's tree, in the static HTML, so it paints before
          React/Tauri finish initializing — otherwise that gap is a blank
          screen with no feedback (docs/CodingStandards.md §9).
        -->
        <div id="app-splash" role="status" aria-live="polite">
            <!--
              Minimize/close, wired by ./src/splashWindowControls.ts (a
              plain-DOM side-effect module, same shape as
              ./src/disableNumberInputScroll.ts) — the window opens at its
              normal configured size and position (no fill-to-monitor here
              any more), so these need to be usable immediately too, not
              only once Shell (AppShell.tsx's own minimize/close pair) has
              mounted. Same glyph ("─") as AppShell's own minimize button,
              for the same control before React ever takes over.
            -->
            <div id="app-splash-controls">
                <button id="app-splash-minimize" type="button" class="iconbtn" aria-label="Minimize">─</button>
                <button id="app-splash-close" type="button" class="iconbtn" aria-label="Close">✕</button>
            </div>
            <svg viewBox="0 0 38 32" width="66" height="56" aria-hidden="true">
                <text x="19" y="16.5" text-anchor="middle" font-size="15" fill="var(--text)" font-family="var(--ui)" font-weight="800">BS</text>
                <rect x="1.5" y="19.5" width="35" height="4" rx="1.6" fill="var(--led)" />
                <rect x="7" y="24" width="4" height="3.6" rx="1.2" fill="var(--led-dim)" />
                <rect x="27" y="24" width="4" height="3.6" rx="1.2" fill="var(--led-dim)" />
                <rect x="3.5" y="28.4" width="31" height="2.2" rx="1.1" fill="var(--led-dim)" />
            </svg>
            <!-- A lorry drives in, stops on the weighbridge to be weighed,
                 then drives off (task: "lorry comming to weightbridge
                 checking weight and going out") — this app's whole domain
                 (PLAN §1: tare/gross/net weighbridge tickets), so the splash
                 now mimes the actual workflow instead of a generic road
                 crossing. Plantation trees line both sides, clear of the
                 weighbridge itself. -->
            <div id="app-splash-truck-track" aria-hidden="true">
                <svg id="app-splash-truck" viewBox="0 0 46 26" width="88" height="50">
                    <rect x="1" y="9" width="21" height="11" rx="1.2" fill="var(--led-dim)" />
                    <path d="M22 11h8.5l6.5 6.2V20H22z" fill="var(--led)" />
                    <rect x="26.5" y="13" width="6" height="4.6" rx="0.6" fill="var(--void)" />
                    <circle class="app-splash-wheel" cx="9" cy="21" r="3.4" fill="var(--text)" />
                    <circle class="app-splash-wheel" cx="32" cy="21" r="3.4" fill="var(--text)" />
                </svg>
                <!-- Weighbridge deck + its LED readout, both fixed at the
                     road's centre — the truck's parked position (see
                     `app-splash-truck-weigh` keyframes) lines up over this. -->
                <span id="app-splash-weighbridge"></span>
                <span id="app-splash-readout">WEIGHING</span>
                <span id="app-splash-road"></span>
                <div id="app-splash-trees" aria-hidden="true">
                    <span class="app-splash-tree"></span>
                    <span class="app-splash-tree"></span>
                    <span class="app-splash-tree"></span>
                    <span class="app-splash-tree"></span>
                    <span class="app-splash-tree"></span>
                    <span class="app-splash-tree"></span>
                </div>
            </div>
            <span class="app-splash-sr">Loading BabuScales…</span>
        </div>
        <script type="module" src="/src/splashWindowControls.ts"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
