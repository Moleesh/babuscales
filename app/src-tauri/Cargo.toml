[package]
name = "babuscales"
version = "1.0.0"
description = "Weighbridge management software that a quarry can actually run."
authors = ["Babulens"]
edition = "2021"
rust-version = "1.77"

[lib]
# Required by the mobile targets (Android/iOS) that Tauri v2 adds later —
# see PLAN §21 Phase 8. Desktop and mobile share this crate.
name = "babuscales_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon": close-to-tray + a Show/Quit menu, PLAN §21 window-behaviour item.
tauri = { version = "2", features = ["tray-icon"] }
# Registers the app to launch at login (Windows: a registry Run key) — the
# app stays running in the tray after close, so once it's autostarted once
# it survives every later sleep/wake without the OS having closed it in
# between; there's no separate OS "on wake" hook to register against.
tauri-plugin-autostart = "2"
# Second-launch guard — reopening the app (Start Menu, desktop shortcut,
# installer's "launch after install") while an instance is already
# tray-resident restarts that existing instance instead of a second
# `babuscales.exe` sharing the same sqlite file/serial ports/LAN server
# port. Wired first in the builder chain below since it must intercept the
# process before any other plugin/window setup runs.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# bundled-full: statically links SQLite, no system install required, and
# turns on FTS5 — PLAN §6.1's `doc_fts`/`master_fts` virtual tables need it.
rusqlite = { version = "0.32", features = ["bundled-full"] }
sha2 = "0.10"
# "serde": needed from here on for `licensing::LicenseState`'s `NaiveDate`
# fields to cross the Tauri IPC boundary — nothing before task #37 sent a
# bare date to the frontend.
chrono = { version = "0.4", features = ["serde"] }
# Same strategy as the TS side's `ulid` package (src/db/id.ts) — every table
# in PLAN §6.1 uses a ULID primary key.
ulid = "1"
# PLAN §17 — the real weight indicator. MIT/Apache-2.0, no system install
# required (talks to the OS serial API directly).
serialport = "4"
# The custom-pattern fallback (PLAN §17's "so any indicator works without a
# code change") — a per-brand frame format the operator supplies as a regex.
regex = "1"
# The QR-verification LAN server (PLAN §18, net/mod.rs) — a blocking,
# dependency-light HTTP server rather than pulling in tokio/axum for one
# small always-on listener. MIT licensed, ~4 small transitive deps.
tiny_http = "0.12"
# Licence activation codes (PLAN §4.10/§12/§23 item 4, task #37) — the wire
# format, base32 grouping and Ed25519 verification all live in this sibling
# crate so the app (verify-only) and the never-shipped `tools/licensegen`
# (sign-only) can't drift apart. See its own module doc for the full design.
license-format = { path = "../../tools/license-format" }
# Task #42's real Email/SMTP delivery. rustls-tls (not native-tls) so this
# never needs a system OpenSSL install on the target machine — consistent
# with PLAN's own "no prerequisites" installer goal, same reasoning as
# rusqlite's "bundled-full" above. default-features off: this app sends one
# message at a time from a single blocking command, so the async/tokio
# transport and connection-pool machinery default-on upstream are dead
# weight here.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
    "hostname",
] }
# Outbox worker task — real delivery for the Webhook/Tally/Board integration
# channels (net/webhook.rs, net/tally.rs, net/board.rs). Same "smallest
# blocking client" call as lettre above: one POST per outbox row from a
# synchronous command, no async/tokio runtime anywhere else in this crate to
# plug into. default-features off drops ureq's own gzip/cookie handling,
# neither of which this one-shot POST needs; "tls" keeps rustls (no system
# OpenSSL, same reasoning as lettre's "rustls-tls"), "json" is pulled in for
# its `serde_json` re-export convenience even though the payload here is
# already a pre-built JSON string.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# HMAC-SHA256 signing for outgoing webhooks (net/webhook.rs) — sha2 (above)
# is already a dependency for the license machine-id hash; hmac is the thin
# wrapper crate that turns any `Digest` impl into a keyed MAC.
hmac = "0.12"
# Hex-encodes the HMAC digest for the X-BabuScales-Signature header.
hex = "0.4"
# `keyring`'s backend is genuinely platform-specific (see the two
# `target.*.dependencies` sections below) — everything else above this line
# is a pure-Rust or self-contained-C dependency that's the same crate/feature
# set on every target this app builds for (Windows and, since task #49,
# Android).

[target.'cfg(windows)'.dependencies]
# PLAN §4.10's "UID machine binding" — reads the OS's own stable machine
# identifier (registry `MachineGuid`) with no admin rights needed. No
# Android backend exists for this crate at all (task #49's
# `licensing::raw_machine_id` covers that target instead).
machine-uid = "0.6"
# Task #52's real printer enumeration (devices/printers.rs) — Win32-only by
# construction (EnumPrintersW). Task #49 gated the module itself to match;
# see devices/printers.rs's own doc comment for the Android side.
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }
# Windows Credential Manager backend.
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
# Task #49 (Android): `keyring` compiles on every target but needs a
# backend feature to actually store anything; none is enabled here (no
# site ships on Linux/macOS yet, and Android's backend is a whole JNI
# integration — the Activity's `Context` has to be handed to the crate at
# startup — this app doesn't have). `Entry::new()`/`.set_password()` etc.
# return a graceful "platform doesn't support persistent credential
# storage" error instead, which `security/mod.rs` already turns into an
# ordinary `AppError` — no code change needed there for this to be honest.
keyring = { version = "3", default-features = false }

[profile.release]
# Smallest installer over fastest build — the installer itself runs ~200MB
# regardless (see README's Install section) because it bakes in the WebView2
# Evergreen Runtime for offline installs; this profile is about the app
# binary inside it, not the installer total.
panic = "abort"
codegen-units = 1
lto = true
strip = true
